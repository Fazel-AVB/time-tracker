<text x="178" y="212" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">git pull</text>
<path d="M340,278 V326" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="330" width="180" height="96" rx="10" fill="#ffffff" stroke="#6b7785" stroke-width="1.5"/>
<text x="340.0" y="356" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">Desktop icon</text>
<text x="340.0" y="376" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">time-tracker-gui</text>
<text x="340.0" y="393" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">starts the server,</text>
<text x="340.0" y="410" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">opens the browser</text>
