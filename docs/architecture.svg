<text x="470" y="154" font-size="13"><tspan font-weight="800" fill="#7C3AED" letter-spacing="1">BROWSER PAGE</tspan><tspan dx="10" fill="#5f6b7a">http://127.0.0.1:8766 · five tabs</tspan></text>
<rect x="470.0" y="168" width="142" height="86" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="541.0" y="194" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">Weekly Table</text>
<text x="541.0" y="214" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">hours per subject</text>
<text x="541.0" y="231" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">and day</text>
