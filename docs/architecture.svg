<text x="340.0" y="214" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">the git clone,</text>
<text x="340.0" y="231" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">installed with</text>
<text x="340.0" y="248" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">pip install -e .</text>
