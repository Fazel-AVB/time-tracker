<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>How Time Tracker works</title>
<desc>The desktop icon starts a small web server on this computer and opens its page in the browser. The page has five tabs: Weekly Table, Weekly Report, Reflection, Goal Review and Import. Every change goes to the server, which stores it in timesheet.db in the ~/.time_tracker folder and writes end-of-week Excel reports there; the Import tab reads such reports back in. Code updates come from GitHub with git pull and never touch that folder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="0.5" y="0.5" width="1279" height="719" rx="16" fill="#ffffff" stroke="#e3e7ec"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#1E1B4B" text-anchor="start">How Time Tracker works</text>
<text x="40" y="78" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Log hours per activity, see weekly reports, reflect and review goals. A small web app that runs in your browser, entirely on your computer.</text>
<circle cx="105" cy="222" r="42" fill="#1f2328"/>
<path transform="translate(105,222) scale(1.6) translate(-8,-8)" fill="#fff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
<text x="105" y="288" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">GitHub</text>
<text x="105" y="306" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">the code only</text>
