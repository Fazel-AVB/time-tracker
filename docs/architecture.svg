<text x="1114.0" y="544" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">history_exports/</text>
<text x="1114.0" y="564" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">an Excel report per week,</text>
<text x="1114.0" y="580" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">when you say yes at week's end</text>
<path d="M1008,566 H964" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="986" y="556" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">import</text>
<rect x="250" y="500" width="450" height="104" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
<text x="268" y="524" font-size="11" font-weight="800" fill="#8a94a3" text-anchor="start" letter-spacing="1">WHAT CROSSES THE DASHED LINE</text>
<text x="268" y="548" font-size="11.5" font-weight="800" fill="#7C3AED" text-anchor="start">IN</text>
<text x="316" y="548" font-size="12" font-weight="400" fill="#1E1B4B" text-anchor="start">Code, when you run git pull.</text>
<text x="268" y="565" font-size="11.5" font-weight="800" fill="#c0362c" text-anchor="start">OUT</text>
<text x="316" y="565" font-size="12" font-weight="400" fill="#1E1B4B" text-anchor="start">Nothing. The page loads nothing from the internet,</text>
<text x="316" y="582" font-size="12" font-weight="400" fill="#1E1B4B" text-anchor="start">and other computers can't reach the server.</text>
<text x="40" y="690" font-size="12.5" font-weight="400" fill="#5f6b7a" text-anchor="start">Update: git pull in the clone. Your data in ~/.time_tracker stays as it is. Commands: time-tracker, time-tracker shortcut, time-tracker import-excel.</text>
</svg>
