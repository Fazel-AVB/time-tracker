<text x="995.5" y="214" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">met / partial /</text>
<text x="995.5" y="231" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">not met</text>
