<text x="1147.0" y="214" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">Excel reports</text>
<text x="1147.0" y="231" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">from earlier runs</text>
<path d="M585,256 V326" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="596" y="284" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="start">every change, sent with a key</text>
<text x="596" y="299" font-size="11" font-weight="400" fill="#5f6b7a" text-anchor="start">that changes at each start</text>
<text x="740" y="316" font-size="13"><tspan font-weight="800" fill="#2563EB" letter-spacing="1">LOCAL SERVER</tspan><tspan dx="10" fill="#5f6b7a">on this computer; stops 10 min after you close the tab</tspan></text>
<rect x="470" y="330" width="230" height="96" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="585.0" y="356" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">web/app.py</text>
<text x="585.0" y="376" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">Flask, on this computer only;</text>
<text x="585.0" y="393" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">checks host and key</text>
<path d="M700,378 H736" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="330" width="230" height="96" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="855.0" y="356" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">service.py</text>
<text x="855.0" y="376" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">what each button does,</text>
<text x="855.0" y="393" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">checks what you typed</text>
<path d="M970,378 H1006" fill="none" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
