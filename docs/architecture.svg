<text x="692.5" y="214" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">totals, averages,</text>
<text x="692.5" y="231" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">charts, CSV</text>
<rect x="773.0" y="168" width="142" height="86" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="844.0" y="194" font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">Reflection</text>
<text x="844.0" y="214" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">the week in words,</text>
<text x="844.0" y="231" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">next week's goals</text>
<rect x="924.5" y="168" width="142" height="86" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
